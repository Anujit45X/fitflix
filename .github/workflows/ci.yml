name: Fitflix CI
on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fitflix
          POSTGRES_USER: fitflix
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitflix -d fitflix"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fitflix .
      - name: Verify production container
        run: |
          docker run -d --name fitflix --network host \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/fitflix \
            -e DATABASE_USER=fitflix -e DATABASE_PASSWORD=ci-test-only \
            -e JWT_SECRET=container-ci-only-key-with-at-least-32-bytes \
            -e APP_ORIGIN=http://localhost:8080 -e SECURE_COOKIE=false fitflix
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health/readiness
          curl -fsS http://localhost:8080/profile | grep 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/profile)" = 401
      - name: Container logs
        if: always()
        run: docker logs fitflix || true
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fitflix
          POSTGRES_USER: fitflix
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitflix -d fitflix"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/fitflix
      DATABASE_USER: fitflix
      DATABASE_PASSWORD: ci-test-only
      JWT_SECRET: ci-only-key-with-32-bytes-never-for-production
      SECURE_COOKIE: 'false'
      RUN_DB_TESTS: 'true'
      DEMO_MODE: 'false'
      APP_ORIGIN: http://localhost:5173
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m unittest discover -s scripts -p test_production_preflight.py
        working-directory: .
      - run: mvn -B verify
        working-directory: backend
      - run: npm ci && npm run format:check && npm test && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local test services
        run: |
          mkdir -p .local
          java -jar backend/target/fitplix-api-1.0.0.jar > .local/api.log 2>&1 &
          cd frontend
          npm run dev -- --host 127.0.0.1 --strictPort > ../.local/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health && curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: node verify-fitflix.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitflix-test-evidence
          path: |
            backend/target/surefire-reports/*.txt
            docs/browser-results.json
            docs/screenshots/current/


