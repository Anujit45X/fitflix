server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fitplix}
    username: ${DATABASE_USER:fitplix}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
management:
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db
  health.mail.enabled: ${MAIL_ENABLED:false}
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
fitplix:
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:noreply@fitplix.local}
  jwt-secret: ${JWT_SECRET}
  allowed-origin: ${APP_ORIGIN:http://localhost:5173}
  secure-cookie: ${SECURE_COOKIE:true}
  demo: ${DEMO_MODE:false}
  trust-proxy: ${TRUST_PROXY:false}
springdoc:
  swagger-ui.path: /api/docs
